<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>لعبة الثعبان للهاتف</title>
    <style>
        * { touch-action: manipulation; }
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
        }
        h2 { margin: 5px 0; }
        #score-board { font-size: 18px; margin-bottom: 10px; }
        canvas {
            border: 3px solid #e94560;
            background-color: #16213e;
            max-width: 90vw;
            max-height: 50vh;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-template-rows: repeat(3, 60px);
            gap: 10px;
            margin-top: 15px;
            direction: ltr; /* لتثبيت أزرار الاتجاهات بشكل صحيح */
        }
        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }
        .btn:active { background-color: #0f3460; }
        #up { grid-column: 2; grid-row: 1; }
        #left { grid-column: 1; grid-row: 2; }
        #right { grid-column: 3; grid-row: 2; }
        #down { grid-column: 2; grid-row: 3; }
    </style>
</head>
<body>

    <h2>🐍 لعبة الثعبان</h2>
    <div id="score-board">النقاط: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="300" height="300"></canvas>

    <div class="controls">
        <button class="btn" id="up" onclick="setDir('UP')">⬆️</button>
        <button class="btn" id="left" onclick="setDir('LEFT')">⬅️</button>
        <button class="btn" id="right" onclick="setDir('RIGHT')">➡️</button>
        <button class="btn" id="down" onclick="setDir('DOWN')">⬇️</button>
    </div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 15;
    const tileCount = canvas.width / gridSize;

    let snake = [{ x: 10, y: 10 }];
    let food = { x: 12, y: 12 };
    let dx = 0, dy = 0;
    let score = 0;

    function setDir(dir) {
        if (dir === 'LEFT' && dx === 0) { dx = -1; dy = 0; }
        if (dir === 'UP' && dy === 0) { dx = 0; dy = -1; }
        if (dir === 'RIGHT' && dx === 0) { dx = 1; dy = 0; }
        if (dir === 'DOWN' && dy === 0) { dx = 0; dy = 1; }
    }

    function gameLoop() {
        moveSnake();
        if (checkGameOver()) {
            alert(`انتهت اللعبة! مجموع نقاطك: ${score}`);
            resetGame();
            return;
        }
        clearCanvas();
        drawFood();
        drawSnake();
    }

    function clearCanvas() {
        ctx.fillStyle = "#16213e";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSnake() {
        ctx.fillStyle = "#4ecca3";
        snake.forEach(part => {
            ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 1, gridSize - 1);
        });
    }

    function drawFood() {
        ctx.fillStyle = "#e94560";
        ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 1, gridSize - 1);
    }

    function moveSnake() {
        if (dx === 0 && dy === 0) return;
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };
        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
            score += 10;
            scoreElement.textContent = score;
            generateFood();
        } else {
            snake.pop();
        }
    }

    function generateFood() {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
    }

    function checkGameOver() {
        if (dx === 0 && dy === 0) return false;
        const head = snake[0];
        const hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
        const hitSelf = snake.slice(1).some(part => part.x === head.x && part.y === head.y);
        return hitWall || hitSelf;
    }

    function resetGame() {
        snake = [{ x: 10, y: 10 }];
        dx = 0; dy = 0;
        score = 0;
        scoreElement.textContent = score;
        generateFood();
    }

    setInterval(gameLoop, 120);
</script>

</body>
</html>
